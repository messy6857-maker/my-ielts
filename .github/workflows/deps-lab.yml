# Temporary helper for the toolchain upgrade branches (never merged to master).
name: deps-lab
on:
  push:
    branches: ['perf/mistakes-paging-20261115']
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm install -g pnpm@8.6.10
      - run: pnpm install --no-frozen-lockfile 2>&1 | tee $RUNNER_TEMP/install.log
      - name: eslint --fix
        run: pnpm lint --fix 2>&1 | tail -5
        continue-on-error: true
      - name: test
        run: pnpm test:run 2>&1 | tee $RUNNER_TEMP/test.log
        continue-on-error: true
      - name: typecheck
        run: pnpm typecheck 2>&1 | tee $RUNNER_TEMP/typecheck.log
        continue-on-error: true
      - name: lint
        run: pnpm lint 2>&1 | tee $RUNNER_TEMP/lint.log
        continue-on-error: true
      - name: build
        run: pnpm build 2>&1 | tee $RUNNER_TEMP/build.log
        continue-on-error: true
      - name: browser e2e
        run: |
          (pnpm preview --port 4173 --strictPort > $RUNNER_TEMP/preview.log 2>&1 &)
          mkdir -p $RUNNER_TEMP/e2e && cp scripts/e2e-browser.mjs $RUNNER_TEMP/e2e/
          cd $RUNNER_TEMP/e2e && npm init -y > /dev/null && npm i playwright@1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          node e2e-browser.mjs http://localhost:4173/ 2>&1 | tee $RUNNER_TEMP/e2e.log
        continue-on-error: true
      - name: e2e against old build (should fail)
        run: |
          git worktree add $RUNNER_TEMP/old fe2c02c > /dev/null 2>&1
          cd $RUNNER_TEMP/old && pnpm install --frozen-lockfile > /dev/null 2>&1 && pnpm build > /dev/null 2>&1
          (pnpm preview --port 4174 --strictPort > $RUNNER_TEMP/preview-old.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:4174/ > /dev/null && break; sleep 1; done
          cd $RUNNER_TEMP/e2e && node e2e-browser.mjs http://localhost:4174/ 2>&1 | grep -E "^(PASS|FAIL)" | cut -c1-200
          git -C $GITHUB_WORKSPACE worktree remove --force $RUNNER_TEMP/old
        continue-on-error: true
      - name: perf before/after
        run: |
          mkdir -p $RUNNER_TEMP/p && cp scripts/perf-browser.mjs $RUNNER_TEMP/p/
          (cd $RUNNER_TEMP/p && npm init -y > /dev/null && npm i playwright@1 > /dev/null 2>&1 && npx playwright install --with-deps chromium > /dev/null 2>&1)
          (pnpm exec vite preview --port 4176 --strictPort > /dev/null 2>&1 &)
          git worktree add $RUNNER_TEMP/old origin/master > /dev/null 2>&1
          (cd $RUNNER_TEMP/old && pnpm install --frozen-lockfile > /dev/null 2>&1 && pnpm build > /dev/null 2>&1)
          (cd $RUNNER_TEMP/old && pnpm exec vite preview --port 4177 --strictPort > /dev/null 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:4176/ > /dev/null && curl -sf http://localhost:4177/ > /dev/null && break; sleep 1; done
          cd $RUNNER_TEMP/p
          for run in 1 2 3; do
            echo "### 改动前 第 $run 次"; TARGETED=cost node perf-browser.mjs http://localhost:4177/ | grep 错词本
            echo "### 改动后 第 $run 次"; TARGETED=cost node perf-browser.mjs http://localhost:4176/ | grep 错词本
          done
          git -C $GITHUB_WORKSPACE worktree remove --force $RUNNER_TEMP/old
        continue-on-error: true
      - name: Commit regenerated lockfile and type declarations
        run: |
          git config user.name "deps-lab"
          git config user.email "deps-lab@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "deps-lab: regenerate lockfile and apply eslint --fix"
          git push origin HEAD:${GITHUB_REF_NAME}
