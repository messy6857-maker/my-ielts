# Temporary helper for the toolchain upgrade branches (never merged to master).
name: deps-lab
on:
  push:
    branches: ['chore/**']
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm install -g pnpm@8.6.10
      - run: pnpm install --no-frozen-lockfile 2>&1 | tee $RUNNER_TEMP/install.log
      - name: eslint --fix
        run: pnpm lint --fix 2>&1 | tail -5
        continue-on-error: true
      - name: test
        run: pnpm test:run 2>&1 | tee $RUNNER_TEMP/test.log
        continue-on-error: true
      - name: typecheck
        run: pnpm typecheck 2>&1 | tee $RUNNER_TEMP/typecheck.log
        continue-on-error: true
      - name: lint
        run: pnpm lint 2>&1 | tee $RUNNER_TEMP/lint.log
        continue-on-error: true
      - name: build
        run: pnpm build 2>&1 | tee $RUNNER_TEMP/build.log
        continue-on-error: true
      - name: Commit regenerated lockfile and type declarations
        run: |
          git config user.name "deps-lab"
          git config user.email "deps-lab@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "deps-lab: regenerate lockfile and apply eslint --fix"
          git push origin HEAD:${GITHUB_REF_NAME}
