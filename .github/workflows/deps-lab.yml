# Temporary helper for the toolchain upgrade branches (never merged to master).
name: deps-lab
on:
  push:
    branches: ['chore/**']
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm install -g pnpm@8.6.10
      - name: Package info
        run: |
          for p in vite @vitejs/plugin-vue vitest @vitest/coverage-v8 vite-plugin-pages unplugin-auto-import unplugin-vue-components unplugin-vue-macros @vue-macros/volar unocss @unocss/reset @unocss/eslint-config @unocss/eslint-plugin vue vue-router @vueuse/core vue-tsc typescript @vue/test-utils jsdom @types/node eslint @antfu/eslint-config taze lint-staged; do
            echo "=== $p"
            npm view "$p" version engines peerDependencies --json 2>/dev/null | tr -d '\n' | cut -c1-600
            echo
          done | tee package-info.txt
      - run: pnpm install --no-frozen-lockfile 2>&1 | tee install.log
      - name: test
        run: pnpm test:run 2>&1 | tee test.log
        continue-on-error: true
      - name: typecheck
        run: pnpm typecheck 2>&1 | tee typecheck.log
        continue-on-error: true
      - name: lint
        run: pnpm lint 2>&1 | tee lint.log
        continue-on-error: true
      - name: build
        run: pnpm build 2>&1 | tee build.log
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: lab
          path: |
            pnpm-lock.yaml
            package-info.txt
            *.log
