name: Build and Deploy
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install Dependencies
        run: npm -g install pnpm@8.6.10 && pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm exec vitest run

      - name: Check Types
        run: pnpm run typecheck

      - name: Lint Critical Modules
        run: pnpm run lint:critical

      - name: Run Build
        run: pnpm run build

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.2.5
        with:
          branch: gh-pages
          folder: dist
