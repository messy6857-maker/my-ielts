name: Verify and deploy
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm install -g pnpm@8.6.10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:run
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: dist
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
      # 部署后冒烟：push 成功不等于线上可访问（曾遇 CDN 延迟）。curl 线上
      # index.html 核对本次构建的 index chunk hash、并验关键 chunk 200。
      # CDN 容忍重试；continue-on-error 只告警，不判部署失败。
      - name: Smoke test deployed site
        continue-on-error: true
        run: |
          set -u
          SITE="https://messy6857-maker.github.io/my-ielts"
          # 本次构建的 index chunk（dist 由 verify 产物下载而来，与部署物一致）
          BUNDLE=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)
          echo "expecting bundle: $BUNDLE"
          ok=""
          for i in $(seq 1 10); do
            if curl -fsSL "$SITE/" -o /tmp/smoke-index.html \
              && grep -q "$BUNDLE" /tmp/smoke-index.html \
              && curl -fsSL -o /dev/null "$SITE/$BUNDLE"; then
              ok=1; break
            fi
            echo "smoke attempt $i: not live yet, retrying in 30s…"
            sleep 30
          done
          if [ -z "$ok" ]; then
            echo "::warning::smoke test did not see $BUNDLE live after retries (CDN delay possible); check $SITE manually"
            exit 1
          fi
          echo "smoke test passed: $BUNDLE is live"
