name: Verify and deploy
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm install -g pnpm@8.6.10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:run
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: website
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: dist
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Verify deployed site (failure does not mean source push failed)
        run: |
          for attempt in $(seq 1 10); do
            node scripts/smoke-site.mjs https://messy6857-maker.github.io/my-ielts && exit 0
            if [ "$attempt" -lt 10 ]; then sleep 30; fi
          done
          echo "::error::部署验证未通过，源码推送已完成；请检查 Pages 更新状态。"
          exit 1
