name: Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm -g install pnpm@11.25.0 && pnpm install --frozen-lockfile

      - name: Verify generated vocabulary
        run: pnpm run data:check

      - name: Build web app
        run: pnpm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # vocabulary 音频 480MB 不打进包，App 内改为在线加载
      - name: Strip heavy audio assets
        run: rm -rf android/app/src/main/assets/public/vocabulary/audio

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-ielts-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
